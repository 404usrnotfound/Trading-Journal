name: trading-journal-foundation
services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading_journal']
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: trading_journal_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init first}
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading_journal_test']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
