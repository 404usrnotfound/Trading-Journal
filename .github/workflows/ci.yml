name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: journal-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Activate the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate
          corepack pnpm --version
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Create isolated local configuration and databases
        run: |
          corepack pnpm env:init
          corepack pnpm db:up
      - name: Apply and verify migrations and least-privilege database access
        run: |
          corepack pnpm db:migrate
          corepack pnpm db:migrate:check
          corepack pnpm db:check
      - name: Check contracts, formatting, lint, types, unit/UI/integration tests and build
        run: corepack pnpm verify
      - name: Verify web and worker startup
        run: |
          corepack pnpm dev > /tmp/journal-foundation-startup.log 2>&1 &
          journal_foundation_pid=$!
          trap 'kill -TERM "$journal_foundation_pid" 2>/dev/null || true; wait "$journal_foundation_pid" || true' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 http://localhost:3000/api/v1/health/live
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:3101/health/ready
      - name: Install the locked Chromium browser and system dependencies
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Verify browser workflows and accessibility
        run: corepack pnpm test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop only this job's databases
        if: always()
        run: docker compose down
