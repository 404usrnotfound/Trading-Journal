name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: journal-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Activate the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate
          corepack pnpm --version
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check dependency security advisories
        run: corepack pnpm security:audit
      - name: Create isolated local configuration and databases
        run: |
          corepack pnpm env:init
          corepack pnpm db:up
      - name: Apply and verify migrations and least-privilege database access
        run: |
          corepack pnpm db:migrate
          corepack pnpm db:migrate:check
          corepack pnpm db:check
      - name: Check contracts, formatting, lint, types, unit/UI/integration tests and build
        env:
          APP_ORIGIN: https://localhost:3000
        run: corepack pnpm verify
      - name: Verify production release artifacts
        run: corepack pnpm --silent release:check > /tmp/journal-release-manifest.json
      - name: Verify production HTTPS, sessions and protected readiness
        run: corepack pnpm ops:https-smoke
      - name: Rehearse isolated database and private-media recovery
        run: corepack pnpm ops:recovery-drill --output work/ci-recovery-evidence.json
      - name: Install the locked Chromium browser and system dependencies
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Verify browser workflows and accessibility
        run: corepack pnpm test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop only this job's databases
        if: always()
        run: docker compose down
